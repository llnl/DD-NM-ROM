name: DD-NM-ROM CI

on:
  push:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  VENV_PATH: .venv
  PYTHON_VERSION: "3.11"

jobs:
  setup-environment:
    name: Set up test environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: 'openmpi'

      - name: Restore virtualenv
        id: virtualenv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_PATH }}
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-venv-${{ hashFiles('.github/requirements.txt', '.github/workflows/ci.yml') }}

      - name: Create and install virtualenv
        if: steps.virtualenv-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip virtualenv
          python -m virtualenv "${VENV_PATH}"
          "${VENV_PATH}/bin/python" -m pip install --upgrade pip
          "${VENV_PATH}/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0"
          "${VENV_PATH}/bin/python" -m pip install -r .github/requirements.txt
          INSTALL_ROOT="${VENV_PATH}/src" \
          PYTHON_BIN="${VENV_PATH}/bin/python" \
            bash conda/llnl_toss/install_sparselinear.sh
          "${VENV_PATH}/bin/python" -m pip install --no-deps --editable .

  serial-tests:
    name: Serial tests
    needs: setup-environment
    runs-on: ubuntu-latest
    env:
      DDNMROM_VERBOSE: "1"
      DDNMROM_LOG_LEVEL: "20"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: 'openmpi'

      - name: Restore virtualenv
        id: virtualenv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_PATH }}
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-venv-${{ hashFiles('.github/requirements.txt', '.github/workflows/ci.yml') }}

      - name: Run NumPy unit tests
        run: |
          "${VENV_PATH}/bin/python" -m pytest tests \
            -v --tb=short \
            --backend=numpy \
            -m "not packaging"

      - name: Run Torch CPU unit tests
        run: |
          "${VENV_PATH}/bin/python" -m pytest tests \
            -v --tb=short \
            --backend=torch_cpu \
            -m "not packaging"

      - name: Run packaging tests
        run: |
          "${VENV_PATH}/bin/python" -m pytest tests \
            -v --tb=short \
            -m packaging

  parallel-tests:
    name: Parallel tests
    needs: setup-environment
    runs-on: ubuntu-latest
    env:
      DDNMROM_VERBOSE: "1"
      DDNMROM_LOG_LEVEL: "20"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: 'openmpi'

      - name: Restore virtualenv
        id: virtualenv-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_PATH }}
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-venv-${{ hashFiles('.github/requirements.txt', '.github/workflows/ci.yml') }}

      - name: Run parallel tests at ranks 2 and 4
        run: |
          # Validate the CPU MPI path before the full rank sweep.
          mpiexec -n 2 \
            "${VENV_PATH}/bin/python" -m pytest \
            tests/test_backend.py \
            -v --tb=short \
            --with-mpi \
            --backend=torch_cpu \
            -m mpi \
            -k test_distributed_parallel

          for ranks in 2 4; do
            mpiexec -n "${ranks}" \
              "${VENV_PATH}/bin/python" -m pytest tests \
              -v --tb=short \
              --with-mpi \
              --backend=torch_cpu \
              -m mpi
          done
