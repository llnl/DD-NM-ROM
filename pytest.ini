[pytest]
markers =
    backend: numpy: Use numpy backend for tests
    backend_torch_cpu: Use torch (CPU only) for tests
    backend_torch_gpu: Use torch with GPU acceleration for tests
    no_backend: Skip backend autouse fixture for import-only tests
    packaging: Tests for building and inspecting the distributable package

norecursedirs = tests/regression/

# Regression tests require GPU/HPC-specific data and hardware. Keep them out
# of every default pytest invocation, including `pytest tests/`.
addopts = --ignore=tests/regression/
